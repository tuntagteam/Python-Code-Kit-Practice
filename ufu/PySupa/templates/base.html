<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#111827">
    <title>{{ page_title }} · After Class Kitchen</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
    <style type="text/tailwindcss">
        @theme {
            --color-ink: #111827;
            --color-paper: #f4f2ec;
            --color-coral: #ff7043;
            --color-mint: #19a974;
            --font-sans: "Inter", "Segoe UI", sans-serif;
        }
        @layer base {
            body { @apply bg-paper text-ink antialiased; }
            button, a { @apply focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-coral; }
        }
        @layer components {
            .surface { @apply rounded-3xl border border-black/5 bg-white shadow-[0_12px_35px_rgba(17,24,39,0.06)]; }
            .eyebrow { @apply text-[11px] font-bold uppercase tracking-[0.18em] text-slate-400; }
            .nav-link { @apply flex items-center gap-3 rounded-2xl px-4 py-3 text-sm font-semibold text-slate-400 transition hover:bg-white/8 hover:text-white; }
            .nav-link.active { @apply bg-coral text-white shadow-[0_8px_24px_rgba(255,112,67,0.28)]; }
            .status-pill { @apply inline-flex items-center gap-1.5 rounded-full px-2.5 py-1 text-[10px] font-extrabold tracking-wide; }
            .status-PENDING { @apply bg-amber-50 text-amber-700; }
            .status-COOKING { @apply bg-orange-50 text-orange-700; }
            .status-READY { @apply bg-sky-50 text-sky-700; }
            .status-COMPLETED { @apply bg-emerald-50 text-emerald-700; }
            .status-CANCELLED { @apply bg-rose-50 text-rose-700; }
            .status-dot { @apply size-1.5 rounded-full bg-current; }
        }
    </style>
</head>
<body class="min-h-screen overflow-x-hidden">
    <div id="mobile-overlay" class="fixed inset-0 z-30 hidden bg-ink/50 backdrop-blur-sm lg:hidden"></div>
    <aside id="sidebar" class="fixed inset-y-0 left-0 z-40 flex w-[270px] -translate-x-full flex-col bg-ink px-5 py-6 text-white transition-transform duration-300 lg:translate-x-0">
        <a href="/" class="flex items-center gap-3 px-2">
            <span class="grid size-11 place-items-center rounded-2xl bg-coral shadow-lg shadow-coral/20">
                <svg viewBox="0 0 24 24" class="size-6 fill-none stroke-current" stroke-width="2"><path d="M6 3v8a3 3 0 0 0 3 3V3M6 8h3M15 3v18M15 3c4 2 4 8 0 10"/></svg>
            </span>
            <span><b class="block text-[15px] tracking-tight">After Class</b><span class="text-xs text-slate-400">Kitchen control</span></span>
        </a>
        <p class="mb-3 mt-10 px-4 text-[10px] font-bold uppercase tracking-[0.22em] text-slate-600">Workspace</p>
        <nav class="space-y-1">
            <a class="nav-link {{ 'active' if active == 'dashboard' }}" href="/"><span class="text-lg">⌂</span> Overview</a>
            <a class="nav-link {{ 'active' if active == 'orders' }}" href="/orders"><span class="text-lg">◫</span> Orders</a>
            <a class="nav-link {{ 'active' if active == 'menu' }}" href="/menu"><span class="text-lg">◇</span> Menu</a>
            <a class="nav-link {{ 'active' if active == 'customers' }}" href="/customers"><span class="text-lg">◎</span> Customers</a>
        </nav>
        <div class="mt-auto rounded-3xl border border-white/8 bg-white/5 p-4">
            <div class="mb-3 flex items-center gap-2"><span class="size-2 rounded-full bg-emerald-400 shadow-[0_0_10px_#34d399]"></span><span class="text-xs font-semibold">Supabase connected</span></div>
            <p class="text-[11px] leading-relaxed text-slate-500">Live restaurant data, served by Flask.</p>
            <a href="/api" class="mt-3 inline-block text-xs font-bold text-coral">Explore API →</a>
        </div>
    </aside>

    <div class="min-h-screen lg:pl-[270px]">
        <header class="sticky top-0 z-20 flex h-20 items-center justify-between border-b border-black/5 bg-paper/85 px-5 backdrop-blur-xl md:px-8 lg:px-10">
            <div class="flex items-center gap-3">
                <button id="menu-button" class="grid size-10 place-items-center rounded-xl bg-white shadow-sm lg:hidden" aria-label="Open navigation">☰</button>
                <div><p class="eyebrow">Restaurant OS</p><h1 class="text-lg font-extrabold tracking-tight">{{ page_title }}</h1></div>
            </div>
            <div class="flex items-center gap-3">
                <div class="hidden items-center gap-2 rounded-full border border-black/5 bg-white px-4 py-2 text-xs font-semibold text-slate-500 sm:flex"><span class="size-2 rounded-full bg-emerald-500"></span> Live operations</div>
                <div class="grid size-10 place-items-center rounded-full bg-ink text-sm font-black text-white">UF</div>
            </div>
        </header>
        <main class="px-5 py-7 md:px-8 lg:px-10 lg:py-9">
            {% block content %}{% endblock %}
        </main>
    </div>

    <script>
        const sidebar = document.querySelector('#sidebar');
        const overlay = document.querySelector('#mobile-overlay');
        document.querySelector('#menu-button')?.addEventListener('click', () => {
            sidebar.classList.remove('-translate-x-full'); overlay.classList.remove('hidden');
        });
        overlay?.addEventListener('click', () => {
            sidebar.classList.add('-translate-x-full'); overlay.classList.add('hidden');
        });
        if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
            gsap.fromTo('[data-animate="heading"]', { y: 18, opacity: 0 }, { y: 0, opacity: 1, duration: 0.55, ease: 'power3.out' });
            gsap.fromTo('[data-animate="card"]', { y: 16, opacity: 0 }, {
                y: 0, opacity: 1, duration: 0.45, delay: 0.06, stagger: { amount: 0.28 },
                ease: 'power3.out', overwrite: 'auto', clearProps: 'transform',
            });
            gsap.fromTo('[data-animate="row"]', { x: 12, opacity: 0 }, {
                x: 0, opacity: 1, duration: 0.4, delay: 0.12, stagger: { amount: 0.32 },
                ease: 'power2.out', overwrite: 'auto', clearProps: 'transform',
            });
        }
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
